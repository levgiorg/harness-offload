name: Bug report
description: Something in Harness Offload misbehaves
labels: [bug]
body:
  - type: input
    id: host
    attributes: { label: Agent harness, description: "Claude Code / Codex / Cursor / Gemini CLI / Pi / OpenCode / …, with version" }
    validations: { required: true }
  - type: input
    id: backend
    attributes: { label: Worker backend and model, description: "e.g. opencode-go/deepseek-v4.1-flash, openrouter:qwen/qwen3-coder" }
  - type: textarea
    id: doctor
    attributes: { label: "`offload doctor` output", render: text }
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Commands, hook input (OFFLOAD_DEBUG_DIR), expected vs actual" }
    validations: { required: true }
