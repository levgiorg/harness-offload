name: hosts-e2e

# Real agent harnesses (GitHub Copilot CLI, Crush, Qwen Code) driven by a
# scripted local mock model — no accounts or API keys. Runs on pull requests
# that touch hooks, connectors or host code, weekly, and on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    paths:
      - "plugins/harness-offload/hooks/**"
      - "plugins/harness-offload/lib/**"
      - "plugins/harness-offload/bin/**"
      - "plugins/harness-offload/dist/**"
      - "plugins/harness-offload/tests/e2e-hosts.sh"
      - "plugins/harness-offload/tests/mock_openai.py"
      - "packages/cli/src/backends/**"
      - "packages/cli/src/commands/hook.ts"
      - "packages/cli/src/hosts/**"

concurrency:
  group: hosts-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the harnesses
        run: npm install -g @github/copilot @qwen-code/qwen-code @charmland/crush
      - name: Plugin bundle is current
        run: node packages/cli/scripts/source-hash.mjs --check
      - name: End to end in each harness
        run: |
          QWEN_CMD="$(command -v qwen)" bash plugins/harness-offload/tests/e2e-hosts.sh copilot crush qwen
