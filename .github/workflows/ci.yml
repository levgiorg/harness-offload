name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: node dist/cli.js --version
      - name: Unit + adapter + MCP + installer tests
        if: runner.os != 'Windows'
        run: bun test
      - name: Smoke test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node dist/cli.js help
          node dist/cli.js outline src/cli.ts
          node dist/cli.js config show

  bash:
    name: Bash engine + conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: typescript
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the TypeScript CLI (needed for BACKEND:MODEL connector tests)
        working-directory: packages/cli
        run: bun install --frozen-lockfile && bun run build
      - name: Use the system bash on macOS (3.2) to catch bash-4-isms
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/sysbash"
          ln -s /bin/bash "$RUNNER_TEMP/sysbash/bash"
          echo "$RUNNER_TEMP/sysbash" >> "$GITHUB_PATH"
      - run: bash --version | head -1
      - name: Conformance suite — bash engine
        run: bash plugins/harness-offload/tests/run.sh
      - name: Conformance suite — TypeScript engine
        run: OFFLOAD_CLI="$PWD/packages/cli/dist/offload-node" bash plugins/harness-offload/tests/run.sh
      - name: Routing table — bash hooks
        run: bash evals/run.sh
      - name: Routing table — TypeScript hooks
        run: bash evals/run.sh --ts

  lint:
    name: shellcheck + manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S error plugins/harness-offload/bin/offload plugins/harness-offload/bin/offload-ts \
            plugins/harness-offload/hooks/pre-read plugins/harness-offload/hooks/pre-bash \
            plugins/harness-offload/hooks/post-bash plugins/harness-offload/hooks/session-start \
            plugins/harness-offload/lib/*.sh scripts/*.sh evals/*.sh
      - name: JSON manifests parse
        run: |
          for f in .claude-plugin/marketplace.json plugins/harness-offload/.claude-plugin/plugin.json \
                   plugins/harness-offload/.codex-plugin/plugin.json plugins/harness-offload/.cursor-plugin/plugin.json \
                   plugins/harness-offload/hooks/hooks.json plugins/harness-offload/hosts/*/*.json \
                   plugins/harness-offload/hosts/gemini/hooks/hooks.json plugins/harness-offload/config/*.json evals/*.json; do
            jq -e . "$f" > /dev/null || { echo "bad JSON: $f"; exit 1; }
          done
      - name: Versions agree
        run: |
          v=$(jq -r .version plugins/harness-offload/.claude-plugin/plugin.json)
          for f in plugins/harness-offload/.codex-plugin/plugin.json plugins/harness-offload/.cursor-plugin/plugin.json plugins/harness-offload/hosts/gemini/gemini-extension.json packages/cli/package.json; do
            [ "$(jq -r .version "$f")" = "$v" ] || { echo "$f is not $v"; exit 1; }
          done
          grep -q "CO_VERSION=\"$v\"" plugins/harness-offload/lib/common.sh
      - name: Bundled plugin dist is up to date
        run: node packages/cli/scripts/source-hash.mjs --check
      - name: Bundled plugin CLI runs without a build
        run: |
          node plugins/harness-offload/dist/cli.js --version
          OFFLOAD_HOST=claude node plugins/harness-offload/dist/cli.js config show > /dev/null
      - name: Claude Code plugin validation
        run: npx --yes @anthropic-ai/claude-code plugin validate plugins/harness-offload || echo "::warning::claude plugin validate unavailable"
