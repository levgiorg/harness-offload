name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: bun-linux-x64, name: offload-linux-x64 }
          - { os: ubuntu-latest, target: bun-linux-arm64, name: offload-linux-arm64 }
          - { os: macos-latest, target: bun-darwin-arm64, name: offload-darwin-arm64 }
          - { os: macos-latest, target: bun-darwin-x64, name: offload-darwin-x64 }
          - { os: windows-latest, target: bun-windows-x64, name: offload-windows-x64.exe }
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run gen
      - run: bun build src/cli.ts --compile --minify --target=${{ matrix.target }} --outfile ../../dist/${{ matrix.name }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  publish:
    name: GitHub release + npm
    runs-on: ubuntu-latest
    needs: binaries
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Build npm package
        working-directory: packages/cli
        run: |
          bun install --frozen-lockfile && bun run build && cp ../../LICENSE .
          # npmjs.com can't resolve repo-relative links: point images and docs at GitHub
          repo="${GITHUB_REPOSITORY}"
          sed -E -e "s#src=\"(docs/[^\"]+)\"#src=\"https://raw.githubusercontent.com/$repo/main/\1\"#g" \
                 -e "s#\]\((docs/[^)]+|SECURITY\.md|CONTRIBUTING\.md|LICENSE)\)#](https://github.com/$repo/blob/main/\1)#g" \
                 ../../README.md > README.md
      - name: Plugin zip
        run: |
          cd plugins && zip -qr ../dist/harness-offload-plugin.zip harness-offload -x 'harness-offload/tests/*' && cd ..
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
