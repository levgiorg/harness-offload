name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: bun-linux-x64, name: offload-linux-x64 }
          - { os: ubuntu-latest, target: bun-linux-arm64, name: offload-linux-arm64 }
          - { os: macos-latest, target: bun-darwin-arm64, name: offload-darwin-arm64 }
          - { os: macos-latest, target: bun-darwin-x64, name: offload-darwin-x64 }
          - { os: windows-latest, target: bun-windows-x64, name: offload-windows-x64.exe }
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: packages/cli/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run gen
      - run: bun build src/cli.ts --compile --minify --target=${{ matrix.target }} --outfile ../../dist/${{ matrix.name }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  publish:
    name: GitHub release + npm
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: packages/cli/.bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: The tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(jq -r .version packages/cli/package.json)
          [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "tag ${GITHUB_REF_NAME} but package.json says $v"; exit 1; }
      - name: Build npm package
        working-directory: packages/cli
        run: |
          bun install --frozen-lockfile && bun run build
          # README (links pointed at GitHub), LICENSE, LICENSE-FONTS; then check what would ship
          node scripts/release-files.mjs
          node scripts/pack-check.mjs
          node scripts/pack-smoke.mjs
      - name: Dependencies are signed as published; SBOM of what ships
        working-directory: packages/cli
        run: |
          npm audit signatures
          npm sbom --sbom-format cyclonedx --omit dev > ../../dist/harness-offload.cdx.json
      - name: Plugin zip
        run: |
          cd plugins && zip -qr ../dist/harness-offload-plugin.zip harness-offload -x 'harness-offload/tests/*' && cd ..
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
      # Trusted publishing (OIDC): no npm token anywhere; npm adds provenance by itself.
      # Set up once on npmjs.com → harness-offload → Settings → Trusted Publisher
      # (GitHub Actions · levgiorg/harness-offload · release.yml). See docs/development.md.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/cli
        run: |
          npm install -g npm@^11.5.1
          npm publish --access public
